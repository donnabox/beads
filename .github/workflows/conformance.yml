name: Conformance

# Runs the same two-tier storage conformance suite developers run locally:
# the in-process store corpus and the real-binary CLI harness.

on:
  pull_request:
    branches: [ main, 'release/**', 'hotfix/**', integration, 'codex/preview3-integration' ]
    # "Upgrade-relevant code" allowlist (spec-f7.md §2.4): any non-test Go
    # change, build input, or this workflow's own inputs. Kept byte-for-byte
    # identical (modulo each workflow's own file/script entries) across
    # conformance.yml, migration-test.yml and cross-version-smoke.yml, and
    # pinned by TestAdvisoryWorkflowPathFilters.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/conformance.yml'
      - 'scripts/conformance.sh'
      - 'test/conformance/**'
      - 'internal/storage/embeddeddolt/conformance_test.go'
      # F7c review fix S4: TestMain (the fixture that builds the
      # pristine embedded-Dolt databases conformance_test.go and every
      # other test in this package reuse) lives here, not in
      # conformance_test.go itself; a PR editing only the fixture was
      # previously excluded by '!**_test.go' with nothing to re-include it.
      - 'internal/storage/embeddeddolt/test_fixture_test.go'
      - 'backend/conformance/**'
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.buildflags'
      - '.github/workflows/conformance.yml'
      - 'scripts/conformance.sh'
      - 'test/conformance/**'
      - 'internal/storage/embeddeddolt/conformance_test.go'
      # F7c review fix S4: TestMain (the fixture that builds the
      # pristine embedded-Dolt databases conformance_test.go and every
      # other test in this package reuse) lives here, not in
      # conformance_test.go itself; a PR editing only the fixture was
      # previously excluded by '!**_test.go' with nothing to re-include it.
      - 'internal/storage/embeddeddolt/test_fixture_test.go'
      - 'backend/conformance/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  conformance:
    name: Storage backend conformance (embedded Dolt oracle)
    timeout-minutes: 45
    runs-on: ${{ github.repository_owner == 'gastownhall' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # F7c review fix N1: fail-closed. setup-go's own implicit cache
          # must stay off on Blacksmith (it cannot see GitHub-hosted cache
          # entries, and the former Blacksmith-side seeder was retired); the
          # prior `!= 'self-hosted'` form fails OPEN (caching turns on) if
          # runner.environment is ever empty/unknown for some future runner
          # class, instead of staying off until proven github-hosted.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Run conformance (embedded Dolt oracle)
        run: ./scripts/conformance.sh
