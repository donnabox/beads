name: Graph C0 preview

on:
  push:
    branches: [codex/janet-c0-delivery-20260923, codex/janet-issue-adapter-20260924, codex/janet-dependency-workflow-20260925, codex/janet-mixed-links-20260925, codex/janet-link-lifecycle-20260925, codex/janet-bdp-read-20260925, codex/janet-read-http-20260926, codex/janet-history-exact-20260926]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BD_DISABLE_METRICS: "1"
      BD_DISABLE_EVENT_FLUSH: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the actual CLI
        run: |
          mkdir -p "$RUNNER_TEMP/c0-evidence" "$RUNNER_TEMP/c0-bin"
          set -o pipefail
          make install-force INSTALL_DIR="$RUNNER_TEMP/c0-bin" | tee "$RUNNER_TEMP/c0-evidence/install.log"
          git rev-parse HEAD > "$RUNNER_TEMP/c0-evidence/source.txt"
          go version > "$RUNNER_TEMP/c0-evidence/go-version.txt"
          sha256sum "$RUNNER_TEMP/c0-bin/bd" > "$RUNNER_TEMP/c0-evidence/binary.sha256"
      - name: Install pinned independent-client Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Build exact public BDP client revision independently
        run: |
          set -euo pipefail
          # Public repository: no token, secret, or inherited checkout credential.
          # This sibling tree never changes the Beads source under qualification.
          mkdir "$RUNNER_TEMP/bdp-client-53bdbd0"
          cd "$RUNNER_TEMP/bdp-client-53bdbd0"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          {
            git init
            git -c credential.helper= fetch --depth=1 https://github.com/gastownhall/bdp.git \
              53bdbd03136875f952af184fce7b3c7af8f74e96
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = 53bdbd03136875f952af184fce7b3c7af8f74e96
            git rev-parse HEAD > "$RUNNER_TEMP/c0-evidence/client-source.txt"
            node --version
            npm install --global --ignore-scripts pnpm@11.20.0
            test "$(node --version)" = v24.16.0
            test "$(pnpm --version)" = 11.20.0
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm exec tsc -b packages/client
            git diff --exit-code HEAD
            git status --porcelain > "$RUNNER_TEMP/c0-evidence/client-working-tree.txt"
            test ! -s "$RUNNER_TEMP/c0-evidence/client-working-tree.txt"
            python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          files = ['pnpm-lock.yaml', 'packages/client/src/index.ts',
                   'packages/client/dist/index.js', 'packages/protocol/src/index.ts',
                   'packages/protocol/dist/index.js', 'schemas/bdp-v0.schema.json']
          receipt = {
              'source': 'gastownhall/bdp',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_method': 'unauthenticated exact-commit public git fetch into separate checkout',
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'pnpm': subprocess.check_output(['pnpm', '--version'], text=True).strip(),
              'install': 'pnpm install --frozen-lockfile --ignore-scripts',
              'build': 'pnpm exec tsc -b packages/client',
              'passed': True,
              'http_interop': False,
              'files': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'c0-evidence/client-build.json').write_text(
              json.dumps(receipt, indent=2) + '\n')
          PY
          } 2>&1 | tee "$RUNNER_TEMP/c0-evidence/client-build.log"
      - name: Qualify embedded command sequence
        run: |
          python3 scripts/graph-c0-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/embedded" --link-lifecycle
      - name: Check CLI admission and write policy
        run: |
          BEADS_TEST_BD_BINARY="$RUNNER_TEMP/c0-bin/bd" TEST_VERBOSE=1 TEST_TIMEOUT=5m \
            TEST_RUN='Test(GraphMode|GraphPreview|BootstrapRejectsCorruptMetadataBeforeWorkspaceWrites|DoctorRejectsCorruptMetadataBeforeSharedServerChecks|DoltKillallRejectsCorruptMetadataBeforeServerCleanup)' \
            ./scripts/test.sh ./cmd/bd > "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log" 2>&1
      - name: Install pinned ordinary Dolt release
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output dolt.tar.gz \
            https://github.com/dolthub/dolt/releases/download/v2.1.8/dolt-linux-amd64.tar.gz
          echo 'f66318f08ed66e409fc39363ae0fff8ce6fbf6dba9f5bac632b91527b9632a74  dolt.tar.gz' | sha256sum --check
          tar -xzf dolt.tar.gz
          cp dolt-linux-amd64/bin/dolt "$RUNNER_TEMP/c0-bin/dolt"
          "$RUNNER_TEMP/c0-bin/dolt" version > "$RUNNER_TEMP/c0-evidence/dolt-version.txt"
      - name: Qualify ordinary shared-server sequence and failure controls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0-server"
          "$RUNNER_TEMP/c0-bin/dolt" sql-server --host 127.0.0.1 --port 15440 \
            --data-dir "$RUNNER_TEMP/c0-server" > "$RUNNER_TEMP/c0-evidence/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          python3 - <<'PY'
          import socket, time
          end = time.monotonic() + 20
          while True:
              try:
                  with socket.create_connection(('127.0.0.1', 15440), timeout=1):
                      break
              except OSError:
                  if time.monotonic() >= end:
                      raise
                  time.sleep(.2)
          PY
          python3 scripts/graph-c0-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/server" \
            --server-port 15440 --server-root "$RUNNER_TEMP/c0-server" --link-lifecycle
          # Dolt 2.1.8 cannot inspect a database created after another session's
          # transaction began. Isolate package setup; explicit same-store
          # concurrency/failure tests still run. See GRAPH_BDP_READ_PROJECTION.md.
          BEADS_GRAPH_TEST_SERVER_PORT=15440 GO_TEST_PKG_PARALLEL=1 TEST_VERBOSE=1 TEST_TIMEOUT=10m \
            ./scripts/test.sh ./internal/storage/graphstore ./internal/configfile \
              ./internal/storage/issueops ./internal/storage/schema \
              ./internal/httpapi/graphread ./internal/httpapi/bdpwire ./internal/httpapi \
            > "$RUNNER_TEMP/c0-evidence/storage-tests.log" 2>&1
          # Provision the fresh CLI-authored HTTP workspace only after all other
          # package setup finishes on this Dolt 2.1.8 server.
          python3 scripts/graph-bdp-read-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --server-port 15440 --bdp-checkout "$RUNNER_TEMP/bdp-client-53bdbd0" \
            --node "$(command -v node)" --output-dir "$RUNNER_TEMP/c0-evidence/http" \
            > "$RUNNER_TEMP/c0-evidence/http-smoke.log" 2>&1
          python3 scripts/graph-history-exact-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/history-exact" \
            > "$RUNNER_TEMP/c0-evidence/history-exact-smoke.log" 2>&1
      - name: Preserve receipts (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graph-c0-linux-receipts
          path: ${{ runner.temp }}/c0-evidence
          retention-days: 14
