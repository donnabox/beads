name: PR114 v1.3.0 wisp diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      BD_DISABLE_METRICS: "1"
      BD_DISABLE_EVENT_FLUSH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f6b2a44390ebfc12f391d22d9d9147c38cfd913
          persist-credentials: false
      - name: Verify exact failed candidate and pinned previous release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/previous"
          gh run download 39347418393 --repo donnabox/beads --name bazel-ci-build-artifacts --dir "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && sha256sum -c SHA256SUMS)
          grep -Fx 'builder=bazel //cmd/bd:bd_for_tests' "$RUNNER_TEMP/candidate/build-manifest.txt"
          grep -E '^commit=(36527acd9885f5714d6462e1c7d0712939248227|5f6b2a44390ebfc12f391d22d9d9147c38cfd913)$' "$RUNNER_TEMP/candidate/build-manifest.txt"
          test "$(git rev-parse HEAD^{tree})" = 5ea91f10f2df3cf1877bc9d9aedfa0151ac7325d
          gh release download v1.3.0 --repo gastownhall/beads --pattern beads_1.3.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP/previous"
          echo '2f92b904ecf35b607e44dc5c39229173af69c54f1183e8d709f1773540cdcf3b  '"$RUNNER_TEMP/previous/beads_1.3.0_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/previous/beads_1.3.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/previous" bd
          chmod +x "$RUNNER_TEMP/candidate/bd-linux-gms-pure" "$RUNNER_TEMP/previous/bd"
          mkdir -p "$RUNNER_TEMP/dolt" "$RUNNER_TEMP/runfiles/_main/tools/bazel/hermetic_bin"
          curl -fsSL https://github.com/dolthub/dolt/releases/download/v2.2.0/dolt-linux-amd64.tar.gz -o "$RUNNER_TEMP/dolt/cli.tar.gz"
          echo '1f7ad8c2622995789420a3fb0f2d16b4aa7430000a825dd91d5938f36480cbf6  '"$RUNNER_TEMP/dolt/cli.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dolt/cli.tar.gz" -C "$RUNNER_TEMP/dolt" dolt-linux-amd64/bin/dolt
          ln -s "$RUNNER_TEMP/dolt/dolt-linux-amd64/bin/dolt" "$RUNNER_TEMP/runfiles/_main/tools/bazel/hermetic_bin/dolt"
          "$RUNNER_TEMP/dolt/dolt-linux-amd64/bin/dolt" version
      - name: Instrument only the failed wisp-upgrade scenario
        run: |
          set -euo pipefail
          export PROBE_ROOT="$RUNNER_TEMP/pr114-v130-evidence"
          export PREV_BIN="$RUNNER_TEMP/previous/bd"
          export CANDIDATE_BIN="$RUNNER_TEMP/candidate/bd-linux-gms-pure"
          export RUNFILES_DIR="$RUNNER_TEMP/runfiles" TEST_WORKSPACE=_main TEST_TMPDIR="$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/probe.py" <<'PYPROBE'
          import pathlib,subprocess,json,os,hashlib,shutil
          phase=pathlib.Path(os.environ['PROBE_ROOT']);phase.mkdir(parents=True)
          ws=pathlib.Path(os.environ['TMPDIR'])/'bd-upgrade-I7xZMD';ws.mkdir()
          prev=pathlib.Path(os.environ['PREV_BIN']);cand=pathlib.Path(os.environ['CANDIDATE_BIN'])
          rows=[]
          (phase/'environment.json').write_text(json.dumps({k:os.environ.get(k) for k in ['HOME','XDG_CONFIG_HOME','DOLT_ROOT_PATH','TMPDIR','BEADS_CEILING_DIRECTORIES','GIT_CEILING_DIRECTORIES','TERM','COLUMNS','LANG','BEADS_TEST_DOLT_BINARY']},indent=2)+'\n')
          def run(name,args,required=True):
           p=subprocess.run([str(x) for x in args],cwd=ws,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
           (phase/(name+'.stdout')).write_text(p.stdout);(phase/(name+'.stderr')).write_text(p.stderr)
           rows.append({'step':name,'argv':[str(x) for x in args],'exit':p.returncode});(phase/'commands.json').write_text(json.dumps(rows,indent=2)+'\n');print(name,p.returncode,p.stdout.strip()[:350],p.stderr.strip()[:180],flush=True)
           if required:assert p.returncode==0,(name,p.returncode,p.stderr)
           return p
          manifest={'source':'5f6b2a44390ebfc12f391d22d9d9147c38cfd913','host':'Linux/amd64 exact failed Bazel candidate artifact; instrumented scenario7 only','binaries':{str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in [prev,cand]},'purpose':'Only failed v1.3.0 wisp upgrade scenario with unsuppressed mutation and human/JSON readback; no passing scenario repeats'};(phase/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          run('00-git-init',['git','init','--quiet']);run('01-name',['git','config','user.name','upgrade-test']);run('02-email',['git','config','user.email','test@beads.test'])
          run('03-prev-version',[prev,'version']);run('04-cand-version',[cand,'version'])
          run('05-prev-init',[prev,'init','--quiet','--non-interactive','--skip-hooks','--skip-agents'],False);run('06-role',['git','config','beads.role','maintainer'])
          r=run('07-prev-wisp',[prev,'create','--silent','--ephemeral','--title','Smoke wisp','--type','task']);wisp=r.stdout.strip();assert wisp and '\n' not in wisp
          r=run('08-prev-blocker',[prev,'create','--silent','--title','Wisp blocker task','--type','task','--priority','1']);blocker=r.stdout.strip();assert blocker and '\n' not in blocker
          run('09-prev-dependency',[prev,'dep','add',wisp,blocker],False)
          run('10-cand-migrate',[cand,'migrate','schema'],False);run('11-cand-init',[cand,'init','--quiet','--non-interactive','--skip-hooks','--skip-agents'],False)
          run('12-list',[cand,'mol','wisp','list','--all']);run('13-ready',[cand,'ready']);run('14-blocked',[cand,'blocked'])
          # Capture immediate update -> human show before any Python logging or JSON read.
          update=subprocess.run([str(cand),'update',wisp,'--notes','smoke wisp mutation'],cwd=ws,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
          show=subprocess.run([str(cand),'show',wisp],cwd=ws,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=120)
          for name,args,pair in [('15-update',[cand,'update',wisp,'--notes','smoke wisp mutation'],update),('16-show',[cand,'show',wisp],show)]:
           (phase/(name+'.stdout')).write_text(pair.stdout);(phase/(name+'.stderr')).write_text(pair.stderr);rows.append({'step':name,'argv':[str(x) for x in args],'exit':pair.returncode});print(name,pair.returncode,pair.stdout.strip()[:350],pair.stderr.strip()[:180],flush=True)
          (phase/'commands.json').write_text(json.dumps(rows,indent=2)+'\n')
          machine=run('17-show-json',[cand,'show',wisp,'--json'],False)
          result={'wisp':wisp,'blocker':blocker,'update_exit':update.returncode,'human_exit':show.returncode,'human_notes_present':'smoke wisp mutation' in show.stdout,'json_exit':machine.returncode,'json_notes_present':'smoke wisp mutation' in machine.stdout};(phase/'result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result),flush=True)
          shutil.copytree(ws,phase/'workspace-snapshot')
          assert result['update_exit']==0 and result['human_exit']==0 and result['human_notes_present'],result

          PYPROBE
          cp "$RUNNER_TEMP/candidate/build-manifest.txt" "$RUNNER_TEMP/candidate/SHA256SUMS" "$RUNNER_TEMP/"
          bash tools/bazel/test_env.sh python3 "$RUNNER_TEMP/probe.py"
      - name: Preserve actual diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr114-v130-wisp-diagnostic
          path: |
            ${{ runner.temp }}/pr114-v130-evidence
            ${{ runner.temp }}/probe.py
            ${{ runner.temp }}/build-manifest.txt
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn
