name: Graph C0 preview

on:
  push:
    branches: [codex/janet-c0-delivery-20260923, codex/janet-issue-adapter-20260924, codex/janet-dependency-workflow-20260925, codex/janet-mixed-links-20260925, codex/janet-link-lifecycle-20260925, codex/janet-bdp-read-20260925, codex/janet-read-http-20260926, codex/janet-history-exact-20260926, codex/janet-memory-update-20260926, codex/janet-memory-recall-20260926, codex/janet-history-compare-20260926, codex/janet-memory-input-20260926, codex/janet-issue-edit-20260926, codex/janet-dependency-unlink-20260926, janet-overwrite-disclosure-20260927, janet-embedded-runner-reuse-20260927, janet-memory-discovery-20260927, janet-issue-reopen-20260927, janet-memory-selected-update-20260927, janet-memory-atomic-patch-20260927, janet-issue-list-20260927, janet-issue-priority-20260927, janet-graph-issue-assignee-20260927, janet-graph-issue-claim-20260927, janet-graph-issue-append-notes-20260927, janet-graph-issue-estimate-20260927, janet-graph-issue-references-20260927, janet-graph-issue-create-fields-20260927, janet-graph-issue-initial-notes-20260928]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-runner-reuse:
    if: github.ref == 'refs/heads/janet-embedded-runner-reuse-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BD_DISABLE_METRICS: "1"
      BD_DISABLE_EVENT_FLUSH: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build actual embedded storage test binary
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runner-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/runner-evidence/source.txt"
          go version > "$RUNNER_TEMP/runner-evidence/go-version.txt"
          cp .github/scripts/embedded-storage-test-shard.sh "$RUNNER_TEMP/runner-evidence/runner.sh"
          go test -tags gms_pure_go -race -c -o "$RUNNER_TEMP/embedded.test" ./internal/storage/embeddeddolt/ \
            > "$RUNNER_TEMP/runner-evidence/build.log" 2>&1
          sha256sum "$RUNNER_TEMP/embedded.test" > "$RUNNER_TEMP/runner-evidence/binary.sha256"
          go version -m "$RUNNER_TEMP/embedded.test" > "$RUNNER_TEMP/runner-evidence/binary-build.txt"
          "$RUNNER_TEMP/embedded.test" -test.list '^Test' > "$RUNNER_TEMP/runner-evidence/binary-tests.txt"
      - name: Exercise the complete affected embedded shard
        timeout-minutes: 16
        env:
          BEADS_TEST_EMBEDDED_DOLT: "1"
          BEADS_TEST_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/embedded.test
        run: |
          set -euo pipefail
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"
          test -x "$BEADS_TEST_EMBEDDED_TEST_BINARY"
          BEADS_TEST_SHARD_LIST_ONLY=1 bash .github/scripts/embedded-storage-test-shard.sh 3 5 \
            > "$RUNNER_TEMP/runner-evidence/selected-tests.txt"
          bash .github/scripts/embedded-storage-test-shard.sh 3 5 \
            > "$RUNNER_TEMP/runner-evidence/shard3.log" 2>&1
          # A skipped or accidentally unselected fixture must not qualify the fix.
          grep -q '^--- PASS: TestSpikeBeadGraphFenceEmbeddedLeg (' "$RUNNER_TEMP/runner-evidence/shard3.log"
      - name: Exercise the explicit relative binary path
        timeout-minutes: 2
        env:
          BEADS_TEST_EMBEDDED_DOLT: "1"
        run: |
          set -euo pipefail
          ln -s "$RUNNER_TEMP/embedded.test" .pr10-embedded-test-bin
          trap 'rm -f .pr10-embedded-test-bin' EXIT
          test -x .pr10-embedded-test-bin
          BEADS_TEST_EMBEDDED_TEST_BINARY=./.pr10-embedded-test-bin \
            bash .github/scripts/embedded-storage-test-shard.sh 3 5 \
            -test.run '^TestSpikeBeadGraphFenceEmbeddedLeg$' -test.timeout=90s \
            > "$RUNNER_TEMP/runner-evidence/relative-fixture.log" 2>&1
          grep -q '^--- PASS: TestSpikeBeadGraphFenceEmbeddedLeg (' "$RUNNER_TEMP/runner-evidence/relative-fixture.log"
      - name: Preserve runner evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr10-embedded-runner-qualification
          path: ${{ runner.temp }}/runner-evidence
          retention-days: 14
  installed-linux:
    runs-on: ubuntu-latest
    # PR52 run36387904670 reached the 50m limit after 4915/5077 receipts;
    # all seven storage packages passed, graphstore taking 879.667s.
    # Preserve the full serial matrix plus initial-notes evidence, with bounded
    # 65m job headroom. A partial or timed-out run never qualifies the source.
    timeout-minutes: 65
    env:
      BD_DISABLE_METRICS: "1"
      BD_DISABLE_EVENT_FLUSH: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the actual CLI
        run: |
          mkdir -p "$RUNNER_TEMP/c0-evidence" "$RUNNER_TEMP/c0-bin"
          set -o pipefail
          make install-force INSTALL_DIR="$RUNNER_TEMP/c0-bin" | tee "$RUNNER_TEMP/c0-evidence/install.log"
          git rev-parse HEAD > "$RUNNER_TEMP/c0-evidence/source.txt"
          go version > "$RUNNER_TEMP/c0-evidence/go-version.txt"
          sha256sum "$RUNNER_TEMP/c0-bin/bd" > "$RUNNER_TEMP/c0-evidence/binary.sha256"
          sha256sum scripts/graph-issue-estimate-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-estimate-harness.sha256"
          sha256sum scripts/graph-issue-initial-notes-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-initial-notes-harness.sha256"
          sha256sum scripts/graph-issue-create-fields-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-create-fields-harness.sha256"
          sha256sum scripts/graph-issue-references-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-references-harness.sha256"
          sha256sum scripts/graph-issue-priority-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-priority-harness.sha256"
          sha256sum scripts/graph-issue-assignee-smoke.py > "$RUNNER_TEMP/c0-evidence/issue-assignee-harness.sha256"
      - name: Install pinned independent-client Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Build exact public BDP client revision independently
        run: |
          set -euo pipefail
          # Public repository: no token, secret, or inherited checkout credential.
          # This sibling tree never changes the Beads source under qualification.
          mkdir "$RUNNER_TEMP/bdp-client-53bdbd0"
          cd "$RUNNER_TEMP/bdp-client-53bdbd0"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          {
            git init
            git -c credential.helper= fetch --depth=1 https://github.com/gastownhall/bdp.git \
              53bdbd03136875f952af184fce7b3c7af8f74e96
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = 53bdbd03136875f952af184fce7b3c7af8f74e96
            git rev-parse HEAD > "$RUNNER_TEMP/c0-evidence/client-source.txt"
            node --version
            npm install --global --ignore-scripts pnpm@11.20.0
            test "$(node --version)" = v24.16.0
            test "$(pnpm --version)" = 11.20.0
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm exec tsc -b packages/client
            git diff --exit-code HEAD
            git status --porcelain > "$RUNNER_TEMP/c0-evidence/client-working-tree.txt"
            test ! -s "$RUNNER_TEMP/c0-evidence/client-working-tree.txt"
            python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          files = ['pnpm-lock.yaml', 'packages/client/src/index.ts',
                   'packages/client/dist/index.js', 'packages/protocol/src/index.ts',
                   'packages/protocol/dist/index.js', 'schemas/bdp-v0.schema.json']
          receipt = {
              'source': 'gastownhall/bdp',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_method': 'unauthenticated exact-commit public git fetch into separate checkout',
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'pnpm': subprocess.check_output(['pnpm', '--version'], text=True).strip(),
              'install': 'pnpm install --frozen-lockfile --ignore-scripts',
              'build': 'pnpm exec tsc -b packages/client',
              'passed': True,
              'http_interop': False,
              'files': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files},
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'c0-evidence/client-build.json').write_text(
              json.dumps(receipt, indent=2) + '\n')
          PY
          } 2>&1 | tee "$RUNNER_TEMP/c0-evidence/client-build.log"
      - name: Qualify embedded command sequence
        run: |
          python3 scripts/graph-c0-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/embedded" --link-lifecycle
      - name: Check CLI admission and write policy
        run: |
          BEADS_TEST_BD_BINARY="$RUNNER_TEMP/c0-bin/bd" TEST_VERBOSE=1 TEST_TIMEOUT=5m \
            TEST_RUN='Test(GraphMode|GraphPreview|GraphMemoryDiscovery|BootstrapRejectsCorruptMetadataBeforeWorkspaceWrites|DoctorRejectsCorruptMetadataBeforeSharedServerChecks|DoltKillallRejectsCorruptMetadataBeforeServerCleanup)' \
            ./scripts/test.sh ./cmd/bd > "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log" 2>&1
          # Claim admission must actually execute, including its readonly dispatch gate.
          for suite in Admission Refusals ReadonlyBeforeDispatch ConstraintErrors; do
            grep -q "^--- PASS: TestGraphPreviewIssueClaim${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestGraphPreviewIssueClaim' "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"; then
            exit 1
          fi
          for suite in Input MixedAndOmitted Refusals DispatchRefusals ReadonlyBeforeDispatch; do
            grep -q "^--- PASS: TestGraphPreviewIssueAppendNotes${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestGraphPreviewIssueAppendNotes' "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"; then
            exit 1
          fi
          for suite in Presence Refusals Readonly ClaimDispatch; do
            grep -q "^--- PASS: TestGraphPreviewIssueEstimate${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
            grep -q "^--- PASS: TestGraphPreviewIssueReferences${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestGraphPreviewIssue(Estimate|References)' "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"; then
            exit 1
          fi
          for suite in Presence InputRefusals Dispatch; do
            grep -q "^--- PASS: TestGraphPreviewIssueCreateFields${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestGraphPreviewIssueCreateFields' "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"; then
            exit 1
          fi
          for suite in InitialNotesInput CreateAuthorshipDispatch; do
            grep -q "^--- PASS: TestGraphPreviewIssue${suite} (" "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestGraphPreviewIssue(InitialNotes|CreateAuthorship)' "$RUNNER_TEMP/c0-evidence/cli-policy-tests.log"; then
            exit 1
          fi
      - name: Install pinned ordinary Dolt release
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output dolt.tar.gz \
            https://github.com/dolthub/dolt/releases/download/v2.1.8/dolt-linux-amd64.tar.gz
          echo 'f66318f08ed66e409fc39363ae0fff8ce6fbf6dba9f5bac632b91527b9632a74  dolt.tar.gz' | sha256sum --check
          tar -xzf dolt.tar.gz
          cp dolt-linux-amd64/bin/dolt "$RUNNER_TEMP/c0-bin/dolt"
          "$RUNNER_TEMP/c0-bin/dolt" version > "$RUNNER_TEMP/c0-evidence/dolt-version.txt"
      - name: Qualify ordinary shared-server sequence and failure controls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0-server"
          "$RUNNER_TEMP/c0-bin/dolt" sql-server --host 127.0.0.1 --port 15440 \
            --data-dir "$RUNNER_TEMP/c0-server" > "$RUNNER_TEMP/c0-evidence/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          python3 - <<'PY'
          import socket, time
          end = time.monotonic() + 20
          while True:
              try:
                  with socket.create_connection(('127.0.0.1', 15440), timeout=1):
                      break
              except OSError:
                  if time.monotonic() >= end:
                      raise
                  time.sleep(.2)
          PY
          python3 scripts/graph-c0-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/server" \
            --server-port 15440 --server-root "$RUNNER_TEMP/c0-server" --link-lifecycle
          # Dolt 2.1.8 cannot inspect a database created after another session's
          # transaction began. Isolate package setup; explicit same-store
          # concurrency/failure tests still run. See GRAPH_BDP_READ_PROJECTION.md.
          # PR52 graphstore passed in 879.667s on Linux, near the old 15m
          # package bound. Allow the additional notes/identity matrix within
          # 20m; require every named gate and exact-source completion as before.
          BEADS_GRAPH_TEST_SERVER_PORT=15440 GO_TEST_PKG_PARALLEL=1 TEST_VERBOSE=1 TEST_TIMEOUT=20m \
            ./scripts/test.sh ./internal/storage/graphstore ./internal/configfile \
              ./internal/storage/issueops ./internal/storage/schema \
              ./internal/httpapi/graphread ./internal/httpapi/bdpwire ./internal/httpapi \
            > "$RUNNER_TEMP/c0-evidence/storage-tests.log" 2>&1
          # Every admitted assignment suite must execute on both real engines.
          for suite in Lifecycle RefusalAndRollback ActiveHolderFenceAndLease ConcurrentPriorityWriter; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueAssignee${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          grep -q '^--- PASS: TestGraphIssueListAssigneeAdmission (' "$RUNNER_TEMP/c0-evidence/storage-tests.log"
          for backend in embedded server; do
            grep -q "^ *--- PASS: TestGraphIssueListAssigneeFilters/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
          done
          # Seven claim roots require both real engines. Lost acknowledgement
          # uses the ordinary shared-server proxy, with no embedded counterpart.
          for suite in Lifecycle RefusalAndRollback ExistingPolicies RejectsUnmappedOutgoingDependency ConcurrentWriters ExternalLeaseBoundary RejectsInconsistentNoop; do
            grep -q "^--- PASS: TestIssueClaim${suite} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueClaim${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          grep -q '^--- PASS: TestIssueClaimLostCommitResponse (' "$RUNNER_TEMP/c0-evidence/storage-tests.log"
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueClaim' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          for suite in Lifecycle ClaimedAndClosed RefusalAndRollback ConcurrentWriters PreservesCurrentReadBudget CannotStealActiveAssignment; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueAppendNotes${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          grep -q '^--- PASS: TestIssueAppendNotesLostCommitResponse (' "$RUNNER_TEMP/c0-evidence/storage-tests.log"
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueAppendNotes' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          # Provision the fresh CLI-authored HTTP workspace only after all other
          # package setup finishes on this Dolt 2.1.8 server.
          python3 scripts/graph-bdp-read-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --server-port 15440 --bdp-checkout "$RUNNER_TEMP/bdp-client-53bdbd0" \
            --node "$(command -v node)" --output-dir "$RUNNER_TEMP/c0-evidence/http" \
            > "$RUNNER_TEMP/c0-evidence/http-smoke.log" 2>&1
          for suite in Lifecycle ClaimedAndClosed RefusalAndRollback ConcurrentTextWriter; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueEstimate${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueEstimate' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          for suite in Lifecycle ClaimedAndClosed RefusalAndRollback ConcurrentTextWriter ExceedsCurrentReadBudget; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueReferences${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueReferences' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          for suite in Lifecycle PresenceAndBounds RefusalAndRollback CopiesInput; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueCreateFields${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueCreateFields' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          for suite in Lifecycle LiteralValues CopiesInput RefusalAndRollback PreservesCurrentReadBudget; do
            for backend in embedded server; do
              grep -q "^ *--- PASS: TestIssueInitialNotes${suite}/${backend} (" "$RUNNER_TEMP/c0-evidence/storage-tests.log"
            done
          done
          if grep -Eq '^ *--- (SKIP|FAIL): TestIssueInitialNotes' "$RUNNER_TEMP/c0-evidence/storage-tests.log"; then
            exit 1
          fi
          python3 scripts/graph-history-exact-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/history-exact" \
            > "$RUNNER_TEMP/c0-evidence/history-exact-smoke.log" 2>&1
          python3 scripts/graph-memory-update-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-update" \
            > "$RUNNER_TEMP/c0-evidence/memory-update-smoke.log" 2>&1
          python3 scripts/graph-memory-recall-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-recall" \
            > "$RUNNER_TEMP/c0-evidence/memory-recall-smoke.log" 2>&1
          python3 scripts/graph-history-compare-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/history-compare" \
            > "$RUNNER_TEMP/c0-evidence/history-compare-smoke.log" 2>&1
          python3 scripts/graph-memory-input-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-input" \
            > "$RUNNER_TEMP/c0-evidence/memory-input-smoke.log" 2>&1
          python3 scripts/graph-issue-edit-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-edit" \
            > "$RUNNER_TEMP/c0-evidence/issue-edit-smoke.log" 2>&1
          python3 scripts/graph-dependency-unlink-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/dependency-unlink" \
            > "$RUNNER_TEMP/c0-evidence/dependency-unlink-smoke.log" 2>&1
          python3 scripts/graph-overwrite-disclosure-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/overwrite-disclosure" \
            > "$RUNNER_TEMP/c0-evidence/overwrite-disclosure-smoke.log" 2>&1
          python3 scripts/graph-memory-discovery-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-discovery" \
            > "$RUNNER_TEMP/c0-evidence/memory-discovery-smoke.log" 2>&1
          python3 scripts/graph-issue-reopen-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-reopen" \
            > "$RUNNER_TEMP/c0-evidence/issue-reopen-smoke.log" 2>&1
          python3 scripts/graph-memory-selected-update-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-selected-update" \
            > "$RUNNER_TEMP/c0-evidence/memory-selected-update-smoke.log" 2>&1
          python3 scripts/graph-memory-atomic-patch-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/memory-atomic-patch" \
            > "$RUNNER_TEMP/c0-evidence/memory-atomic-patch-smoke.log" 2>&1
          python3 scripts/graph-issue-list-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-list" \
            > "$RUNNER_TEMP/c0-evidence/issue-list-smoke.log" 2>&1
          python3 scripts/graph-issue-priority-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --backend both --server-port 15440 \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-priority" \
            > "$RUNNER_TEMP/c0-evidence/issue-priority-smoke.log" 2>&1
          python3 scripts/graph-issue-assignee-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-assignee" \
            --backend both --server-port 15440 --server-root "$RUNNER_TEMP/c0-server" \
            --total-timeout 900 > "$RUNNER_TEMP/c0-evidence/issue-assignee-smoke.log" 2>&1
          python3 scripts/graph-issue-claim-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-claim" \
            --backend both --server-port 15440 --server-root "$RUNNER_TEMP/c0-server" \
            --total-timeout 300 > "$RUNNER_TEMP/c0-evidence/issue-claim-smoke.log" 2>&1

          python3 scripts/graph-issue-append-notes-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-append-notes" \
            --backend both --server-port 15440 --server-root "$RUNNER_TEMP/c0-server" \
            --total-timeout 300 > "$RUNNER_TEMP/c0-evidence/issue-append-notes-smoke.log" 2>&1
          python3 scripts/graph-issue-estimate-smoke.py --bd "$RUNNER_TEMP/c0-bin/bd" \
            --output-dir "$RUNNER_TEMP/c0-evidence/issue-estimate" \
